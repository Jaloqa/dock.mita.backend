name: Branch flow

on:
  pull_request:
    branches: [main, preprod, develop]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source → target
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            main)
              [[ "$HEAD" == "preprod" || "$HEAD" == hotfix/* ]] || { echo "::error::PR do main tylko z preprod lub hotfix/*"; exit 1; } ;;
            preprod)
              [[ "$HEAD" == "develop" || "$HEAD" == hotfix/* ]] || { echo "::error::PR do preprod tylko z develop lub hotfix/*"; exit 1; } ;;
          esac
          echo "OK: $HEAD → $BASE"
